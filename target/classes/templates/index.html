<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>UOION Spring Boot</title>

    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

<div class="container">

    <h1>🚀 Welcome to UOION Apps20</h1>

    <p>
        Spring Boot application is running successfully.
    </p>

    <table>

        <tr>
            <th>Application</th>
            <td th:text="${appName}"></td>
        </tr>

        <tr>
            <th>Version</th>
            <td th:text="${version}"></td>
        </tr>

        <tr>
            <th>Java Version</th>
            <td th:text="${javaVersion}"></td>
        </tr>

        <tr>
            <th>Hostname</th>
            <td th:text="${hostname}"></td>
        </tr>

    </table>

</div>

</body>
</html>
